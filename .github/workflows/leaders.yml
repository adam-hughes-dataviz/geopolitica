name: Party leaders
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  leaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python3 -u fetch_leaders.py
      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add leaders.json
          git diff --cached --quiet || git commit -m "Party leaders"
          git pull --rebase -X theirs origin main
          for i in 1 2 3 4 5; do git push && break; sleep $((i*15)); git pull --rebase -X theirs origin main; done
