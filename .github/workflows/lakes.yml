name: Lake outlines
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install shapely
      - run: python3 -u fetch_lake_outlines.py
      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add geography.json lake_outlines.json
          git diff --cached --quiet || git commit -m "Add lake outlines from OpenStreetMap"
          git pull --rebase -X theirs origin main
          for i in 1 2 3 4 5; do git push && break; sleep $((i*15)); git pull --rebase -X theirs origin main; done
