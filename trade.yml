name: Refresh trade data
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pycountry
      - run: python3 fetch_trade.py
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add trade.json
          git diff --cached --quiet || git commit -m "Refresh trade data"
          git push
